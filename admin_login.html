<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="login-page"><div class="login-box"><div class="text-center mb-4"><div class="login-logo">🍽️</div><h2>Canteen Admin</h2><p class="text-muted">Manage food, orders and stock</p></div>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" required autofocus></div><div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div><button class="btn btn-dark w-100">Login</button></form><a href="{{ url_for('index') }}" class="btn btn-link w-100 mt-2">Back to Canteen</a></div></body></html>
