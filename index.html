<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canteen Order</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="container py-3">
      <div class="brand-row">
        <button id="brandAdminTrigger" class="brand-btn" type="button" aria-label="Canteen">
          <span class="brand-icon">🍽️</span>
          <span>
            <strong>Canteen</strong>
            <small>Quick Order</small>
          </span>
        </button>
        <div class="header-actions">
          <button id="adminOpenBtn" class="btn btn-outline-dark btn-sm" type="button">⚙️ Admin</button>
          <button class="btn cart-top" data-bs-toggle="offcanvas" data-bs-target="#cartCanvas">
            🛒 Cart <span id="cartBadge" class="badge text-bg-dark">0</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="container pb-5">
    <section class="hero-card mt-3">
      <div>
        <span class="eyebrow">SELF ORDER</span>
        <h1 id="menuTitle">🍽️ Canteen Menu</h1>
        <p id="menuTime" class="mb-0">Checking menu...</p>
      </div>
    </section>

    <div id="categoryChips" class="category-chips my-3"></div>

    <div class="search-wrap mb-3">
      <input id="searchInput" class="form-control form-control-lg" type="search" placeholder="🔎 Search food...">
    </div>

    <div id="itemsGrid" class="row g-3"></div>

    <div id="emptyState" class="empty-state d-none">
      <div>🍽️</div>
      <h5>No items available</h5>
      <p class="mb-0">Please check another category or time.</p>
    </div>
  </main>

  <button class="floating-cart" data-bs-toggle="offcanvas" data-bs-target="#cartCanvas">
    🛒 <span id="floatingCount">0</span> · ₹<span id="floatingTotal">0</span>
  </button>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="cartCanvas">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">🛒 Your Order</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div id="cartItems"></div>

      <div class="checkout-box mt-3">
        <label class="form-label">Name</label>
        <input id="customerName" class="form-control mb-2" placeholder="Your name">

        <label class="form-label">Table / Room</label>
        <input id="tableRoom" class="form-control mb-2" placeholder="Table or room number">

        <label class="form-label">Note</label>
        <textarea id="orderNote" class="form-control" rows="2" placeholder="Less spicy, no sugar..."></textarea>

        <div class="total-row">
          <span>Total</span>
          <strong>₹<span id="cartTotal">0</span></strong>
        </div>

        <button id="sendWhatsapp" class="btn btn-success w-100 btn-lg mt-2">
          💬 Send Order to WhatsApp
        </button>
        <button id="clearCart" class="btn btn-outline-secondary w-100 mt-2">
          Clear Cart
        </button>
      </div>
    </div>
  </div>

  <!-- Hidden admin login -->
  <div class="modal fade" id="adminLoginModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">🔐 Admin Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input id="adminUsername" class="form-control mb-2" placeholder="Username">
          <input id="adminPassword" class="form-control" type="password" placeholder="Password">
          <div id="adminLoginError" class="text-danger small mt-2"></div>
        </div>
        <div class="modal-footer">
          <button id="adminLoginBtn" class="btn btn-dark w-100">Login</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Admin panel -->
  <div class="modal fade" id="adminModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <h5 class="modal-title">⚙️ Canteen Admin</h5>
            <small class="text-muted">Add, edit, delete and control food availability.</small>
          </div>
          <button id="adminLogout" class="btn btn-outline-danger btn-sm">Logout</button>
        </div>
        <div class="modal-body">
          <div id="adminForm" class="admin-form d-none">
            <input type="hidden" id="editItemId">
            <div class="row g-2">
              <div class="col-md-4">
                <label class="form-label">Food name</label>
                <input id="foodName" class="form-control" placeholder="Food name">
              </div>
              <div class="col-md-2">
                <label class="form-label">Price</label>
                <input id="foodPrice" class="form-control" type="number" min="0" step="0.01">
              </div>
              <div class="col-md-2">
                <label class="form-label">Category</label>
                <select id="foodCategory" class="form-select">
                  <option>Breakfast</option>
                  <option>Lunch</option>
                  <option>Dinner</option>
                  <option>Drinks</option>
                  <option>Snacks</option>
                </select>
              </div>
              <div class="col-md-2">
                <label class="form-label">Start</label>
                <input id="foodStart" class="form-control" type="time">
              </div>
              <div class="col-md-2">
                <label class="form-label">End</label>
                <input id="foodEnd" class="form-control" type="time">
              </div>
              <div class="col-md-2">
                <label class="form-label">Icon</label>
                <input id="foodIcon" class="form-control" placeholder="🍛">
              </div>
              <div class="col-md-3 d-flex align-items-end">
                <div class="form-check">
                  <input id="foodActive" class="form-check-input" type="checkbox" checked>
                  <label class="form-check-label">Show item</label>
                </div>
              </div>
              <div class="col-md-7 d-flex align-items-end gap-2">
                <button id="saveItemBtn" class="btn btn-primary">Save Item</button>
                <button id="cancelItemBtn" class="btn btn-outline-secondary">Cancel</button>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="mb-0">Food Items</h6>
            <button id="addItemBtn" class="btn btn-dark">+ Add Food</button>
          </div>
          <div class="table-responsive">
            <table class="table table-sm align-middle">
              <thead>
                <tr>
                  <th>Item</th><th>Category</th><th>Price</th><th>Time</th><th>Status</th><th>Action</th>
                </tr>
              </thead>
              <tbody id="adminItemsBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="container text-center py-4 text-muted small">
    Canteen Ordering System · <button id="footerAdminBtn" class="btn btn-link btn-sm p-0">Admin Login</button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
